{% extends "base.html" %}

{% block title %}Page Not Found — Project Chess{% endblock %}

{% block head %}
<style>
    body {
        background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)),
            url('/static/images/chess-board.jpg') center/cover no-repeat fixed;
    }
</style>
{% endblock %}

{% block body %}
<div class="flex-1 flex flex-col items-center justify-center px-4 py-16 text-center">
    <div style="font-size:5rem;line-height:1;color:#cca343;">♟</div>
    <h1 class="text-8xl font-bold mt-4" style="color:#cca343;">404</h1>
    <p class="text-xl font-semibold text-white mt-4">Page Not Found</p>
    <p class="text-sm text-white/40 mt-2 max-w-sm">
        Looks like this square is empty. The page you're looking for doesn't exist or has been moved.
    </p>
    <a href="{{ url_for('auth.home') if session.get('user_id') else url_for('auth.index') }}"
        class="mt-8 inline-flex items-center gap-2 px-6 py-3 rounded-lg font-bold text-sm uppercase tracking-widest text-[#121214]"
        style="background:#cca343;">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
        </svg>
        Back to Home
    </a>
</div>
{% endblock %}
